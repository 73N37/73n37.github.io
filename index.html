<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIDA M365</title>
    <script type="text/javascript">
        // SPA routing path restoration for GitHub Pages
        (function () {
            try {
                var redirect = sessionStorage.getItem('redirect_path');
                if (redirect) {
                    sessionStorage.removeItem('redirect_path');
                    window.history.replaceState(null, null, redirect);
                }
            } catch (e) {
                console.warn("sessionStorage is restricted in this environment:", e);
            }
        })();

        // Programmatically clear all MSAL token and session cache keys to trigger a clean auth flow
        // without logging the user out of their browser-wide Microsoft session (Single Sign-On).
        window.clearMsalCache = function () {
            try {
                console.log("[AIDA] Clearing MSAL session/local storage cache...");
                var keysToRemove = [];
                var clientId = "7e3e2434-c4b9-4de4-a4ed-1390e0fbdc4d";
                
                for (var i = 0; i < sessionStorage.length; i++) {
                    var key = sessionStorage.key(i);
                    if (key && (key.indexOf('msal') >= 0 || key.indexOf(clientId) >= 0)) {
                        keysToRemove.push(key);
                    }
                }
                for (var i = 0; i < localStorage.length; i++) {
                    var key = localStorage.key(i);
                    if (key && (key.indexOf('msal') >= 0 || key.indexOf(clientId) >= 0)) {
                        keysToRemove.push(key);
                    }
                }
                
                keysToRemove.forEach(function (k) {
                    sessionStorage.removeItem(k);
                    localStorage.removeItem(k);
                    console.log("[AIDA] Removed cache key: " + k);
                });
                console.log("[AIDA] MSAL cache cleared.");
            } catch (e) {
                console.error("[AIDA] Failed to clear MSAL cache:", e);
            }
        };
    </script>
    <base href="/" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>
    <div id="app">
        <div style="display:flex;justify-content:center;align-items:center;height:100vh;">
            <p>Loading...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/Microsoft.Authentication.WebAssembly.Msal/AuthenticationService.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>

</html>
