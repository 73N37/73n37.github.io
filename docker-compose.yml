version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: gods_postgres_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: gods_booking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gods_booking_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgrest:
    image: postgrest/postgrest:v12.0.2
    container_name: gods_postgrest_api
    ports:
      - "3000:3000"
    environment:
      PGRST_DB_URI: postgres://postgres:postgres_password@db:5432/gods_booking_db
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: postgres
      PGRST_OPENAPI_MODE: follow-privileges
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
