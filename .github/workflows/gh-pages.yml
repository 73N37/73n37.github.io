name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Triggers deployment when you push to the main branch

permissions:
  contents: write  # Gives permission to publish to the gh-pages branch

jobs:
  deploy-to-github-pages:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the source code
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Setup the .NET 8.0 SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      # 3. Publish the Blazor WebAssembly app in Release mode
      - name: Publish Blazor WASM
        run: dotnet publish AIDA-M365/src/AIDA.M365.csproj -c Release -o release

      # 4. Dynamically configure routing for GitHub Pages
      - name: Configure GitHub Pages Routing
        run: |
          # Get repo details from repository info
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d '/' -f 2)
          OWNER="${{ github.repository_owner }}"
          
          # Convert to lowercase to avoid case-sensitivity issues (e.g. 73N37 vs 73n37)
          REPO_NAME_LOWER=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
          USER_PAGE_NAME_LOWER=$(echo "$OWNER.github.io" | tr '[:upper:]' '[:lower:]')
          
          # Handle User Pages (root domain /) vs Project Pages (/repo-name/)
          if [ "$REPO_NAME_LOWER" = "$USER_PAGE_NAME_LOWER" ]; then
              BASE_HREF="/"
          else
              BASE_HREF="/$REPO_NAME/"
          fi
          
          echo "Configuring index.html base href to: $BASE_HREF"
          sed -i "s|<base href=\"/\" />|<base href=\"$BASE_HREF\" />|g" release/wwwroot/index.html

          # ── MSAL Auth Callback Pages ────────────────────────────────────────
          # Update base href in authentication callback pages too.
          # These are real static HTML files (not SPA routes) that GitHub Pages
          # serves directly when Microsoft redirects back after login.
          if [ -f "release/wwwroot/authentication/login-callback.html" ]; then
            sed -i "s|<base href=\"/\" />|<base href=\"$BASE_HREF\" />|g" release/wwwroot/authentication/login-callback.html
            echo "Updated base href in login-callback.html"
          fi
          if [ -f "release/wwwroot/authentication/logout-callback.html" ]; then
            sed -i "s|<base href=\"/\" />|<base href=\"$BASE_HREF\" />|g" release/wwwroot/authentication/logout-callback.html
            echo "Updated base href in logout-callback.html"
          fi

          # ── GitHub Pages Workaround for MSAL Redirect URIs ──────────────────
          # GitHub Pages serves authentication/login-callback.html when the browser
          # requests /authentication/login-callback (it tries .html extension automatically).
          # This is the registered redirect_uri in Azure Entra ID:
          #   https://73n37.github.io/authentication/login-callback
          # No additional configuration is needed — GitHub Pages handles it.

          # Create .nojekyll to prevent GitHub from blocking Blazor framework files starting with underscore
          touch release/wwwroot/.nojekyll

      # 5. Deploy to the gh-pages branch using a secure action
      - name: Deploy to GitHub Pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: release/wwwroot
          branch: gh-pages
